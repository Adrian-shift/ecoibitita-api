spring.application.name=api

server.port=8080

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/ecoibitita
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Cloudflare R2 (armazenamento de fotos)
r2.endpoint=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_KEY}
r2.bucket=ecoibitita-fotos
r2.public-url=https://pub-9a04d6af481f41d296a03459e4fd7760.r2.dev

# Limite de upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB