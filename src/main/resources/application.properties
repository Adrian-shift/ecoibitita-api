spring.application.name=api

server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Cloudflare R2 (armazenamento de fotos)
r2.endpoint=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_KEY}
r2.bucket=ecoibitita-fotos
r2.public-url=https://pub-9a04d6af481f41d296a03459e4fd7760.r2.dev

# Limite de upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# Limite de denúncias por IP (por hora)
limite.envios-por-hora=20

# Autenticação (JWT)
jwt.secret=${JWT_SECRET}
jwt.expiracao-horas=8

# CORS: origens permitidas, separadas por vírgula
cors.origens=${CORS_ORIGENS:https://denuncia-nu.vercel.app,http://localhost:5173,http://localhost:5174}

# Identificação do IP do visitante (definida após o diagnóstico no Render)
limite.cabecalho-ip=${LIMITE_CABECALHO_IP:}
limite.log-ip=${LIMITE_LOG_IP:false}
# Tentativas de login por IP a cada 15 minutos
limite.login-por-15-minutos=10